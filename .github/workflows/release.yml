name: Release

on:
  workflow_dispatch:

# Do not cancel in-progress releases
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0 # commitizen needs full history to find the last tag

      - name: Bump version
        id: cz
        uses: commitizen-tools/commitizen-action@338bbd841b75aaee6bf5340e1fa12f6ab58ff9ff # 0.27.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push version bump and tag
        if: steps.cz.outputs.next_version != steps.cz.outputs.previous_version
        run: git push --follow-tags

      - name: Create GitHub release
        if: steps.cz.outputs.next_version != steps.cz.outputs.previous_version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "v${{ steps.cz.outputs.next_version }}" --title "v${{ steps.cz.outputs.next_version }}" --generate-notes
