# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# spell-checker: ignore aquasecurity

# The Dockerfile COPYs pyproject.toml and uv.lock and builds the venv from them,
# so a lock change really does change the image — it belongs in the path filter.
# Scheduled weekly as well: new CVEs land against an unchanged image.

name: Container

# No push trigger: the pull request scanned this exact image, and the weekly
# schedule below re-scans main against newly published advisories.
on:
  pull_request:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/container.yml'
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Pull-request findings are uploaded to the Security tab rather than failing
  # the job; that needs write access to code scanning.
  security-events: write

jobs:
  container-scan:
    name: Container Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Dockerfile
          load: true
          pull: true
          tags: relab-rpi-cam-plugin:${{ github.sha }}
      # The venv and the apt-installed picamera2 are only importable when the
      # runtime interpreter matches the 3.13 they were built for; a base image
      # bump to a newer Python breaks that silently. This catches it.
      - name: Smoke-test imports
        run: docker run --rm --entrypoint python relab-rpi-cam-plugin:${{ github.sha }} -c "import fastapi, picamera2"
      # A base-image CVE is a "somebody act this week" event, not a "block this
      # merge" one: advisories land faster than Debian rebuilds the image, so a
      # blocking PR gate fails continuously and stops being read. It failed 27 of
      # 71 runs over the last 90 days, currently on three openssl advisories that
      # are already fixed upstream and only waiting on a base-image rebuild.
      #
      # So: pull requests report into the Security tab and stay green; the weekly
      # scheduled run is the gate that can actually go red for a reason.
      - name: Scan image with Trivy (report)
        if: github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: relab-rpi-cam-plugin:${{ github.sha }}
          format: sarif
          output: trivy-image.sarif
          exit-code: "0"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          # Without this the SARIF carries every severity, so the Security tab
          # stops matching what the gate below actually enforces.
          limit-severities-for-sarif: true

      - name: Upload Trivy results
        if: github.event_name == 'pull_request'
        uses: github/codeql-action/upload-sarif@486fec2a3ea2626afcd8c7e9208b4f515078dd7e # codeql-bundle-v2.26.4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Scan image with Trivy (gate)
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: relab-rpi-cam-plugin:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
