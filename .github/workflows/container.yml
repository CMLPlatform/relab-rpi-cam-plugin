# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# spell-checker: ignore aquasecurity

# The Dockerfile COPYs pyproject.toml and uv.lock and builds the venv from them,
# so a lock change really does change the image — it belongs in the path filter.
# Scheduled weekly as well: new CVEs land against an unchanged image.

name: Container

on:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/container.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/container.yml'
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  container-scan:
    name: Container Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Dockerfile
          load: true
          pull: true
          tags: relab-rpi-cam-plugin:${{ github.sha }}
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: relab-rpi-cam-plugin:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
