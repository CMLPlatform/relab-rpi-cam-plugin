name: Publish relab-rpi-cam-models

on:
  push:
    tags:
      - "relab-rpi-cam-models-v*.*.*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-tag:
    name: Validate package tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Verify tag matches package version
        run: python scripts/validate_models_package_tag.py "${{ github.ref_name }}"

  build:
    needs: validate-tag
    uses: ./.github/workflows/models-check-reusable.yml
    with:
      python_version: "3.13"
      upload_artifact: true

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/relab-rpi-cam-models
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: relab-rpi-cam-models-dist
          path: dist/relab-rpi-cam-models

      - name: Publish distribution
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/relab-rpi-cam-models
