name: relab-rpi-cam-models Checks (reusable)

on:
  workflow_call:
    inputs:
      python_version:
        required: false
        type: string
        default: "3.13"
      upload_artifact:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  models-check:
    name: relab-rpi-cam-models Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ inputs.python_version }}

      - name: Install dependencies
        run: uv sync --locked --all-groups

      # No ruff here: CI's `prek run --all-files` already lints and formats this
      # source repo-wide. The contract test stays — on the publish path it is the only
      # check that runs against the exact tagged commit.
      - name: Run contract package tests
        run: uv run pytest tests/unit/core/test_contract_package.py -q

      - name: Build package
        run: uv build --package relab-rpi-cam-models --out-dir dist/relab-rpi-cam-models --clear

      - name: Smoke test built wheel in an isolated env
        run: |
          set -euo pipefail
          uv run \
            --isolated \
            --no-project \
            --with dist/relab-rpi-cam-models/*.whl \
            python - <<'PY'
          from relab_rpi_cam_models import PairingPollResponse, PairingStatus

          assert PairingPollResponse.waiting().status is PairingStatus.WAITING
          PY

      - name: Upload package artifacts
        if: inputs.upload_artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: relab-rpi-cam-models-dist
          path: dist/relab-rpi-cam-models/*
          retention-days: 7
