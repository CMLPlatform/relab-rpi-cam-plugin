# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: CI

# No push trigger: main only advances through a PR, so a push run repeats the
# check that already passed on the PR head. security.yml keeps its push trigger
# on purpose — a secret reaching main is exactly what a post-merge scan is for.
on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Lint and test share one runner on purpose: both need the same synced env, the
  # suite runs in seconds, and acquiring a hosted runner costs minutes. Splitting
  # them buys parallelism the queue takes straight back.
  check:
    name: Lint & Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.13"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - run: uv sync --locked --all-groups

      # Covers ruff (check + format), ty, gitleaks over the tree, actionlint,
      # uv-lock and the openapi schema check — repo-wide, so no other job repeats them.
      - name: Run prek
        run: uv run prek run --all-files

      - name: Run tests
        run: uv run pytest --cov=app --cov=r9cam_models --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
