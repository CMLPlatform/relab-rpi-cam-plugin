[project]
  authors = [{ name = "Simon van Lierde", email = "s.n.van.lierde@cml.leidenuniv.nl" }]
  classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Capture",
    "Topic :: Multimedia :: Video :: Capture",
    "Topic :: System :: Hardware",
  ]
  description = "Shared Pydantic models for R9lab Raspberry Pi Camera plugin models"
  license = "Apache-2.0"
  license-files = ["LICENSE"]
  maintainers = [{ name = "Simon van Lierde", email = "s.n.van.lierde@cml.leidenuniv.nl" }]
  name = "r9cam-models"
  readme = "README.md"
  requires-python = ">=3.13"
  version = "0.6.0" # NOTE: Published independently via the models tag workflow

  dependencies = ["pydantic>=2.9"]

  [project.urls]
    Homepage   = "https://github.com/CMLPlatform/r9cam"
    Issues     = "https://github.com/CMLPlatform/r9cam/issues"
    Repository = "https://github.com/CMLPlatform/r9cam.git"

[build-system]
  build-backend = "uv_build"
  requires      = ["uv_build>=0.12.3,<0.13"]
